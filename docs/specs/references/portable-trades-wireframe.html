&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

  const connectorGlobals = {};

    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,

      })),
    };

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }

        } catch (error) {

        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {
                return;
              }

                pendingStateWrites.delete(id);

      } catch {
        return;
      }
      hostPort = nextHostPort;

    if (event.defaultPrevented) {
      return;
    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

(()=&gt;{const root=document.getElementById(&#x27;trade-proposal&#x27;);const q=s=&gt;root.querySelector(s);let box=0,editor=&#x27;basic&#x27;,status=&#x27;legal&#x27;,invalidBox=1,mode=&#x27;Equipo&#x27;,received=false,returned=false;let team=[&#x27;Arcanine&#x27;,&#x27;Pikachu&#x27;,&#x27;&#x27;,&#x27;&#x27;,&#x27;&#x27;,&#x27;&#x27;];let previousFocus;let fieldId=0;
const icons=()=&gt;{if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})};
const sprite=name=&gt;`&lt;img src=&quot;https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${name===&#x27;Pikachu&#x27;?25:59}.png&quot; alt=&quot;${name}&quot;&gt;`;
const choices={&#x27;Especie&#x27;:[&#x27;Arcanine&#x27;,&#x27;Pikachu&#x27;,&#x27;Eevee&#x27;,&#x27;Charizard&#x27;],&#x27;Naturaleza&#x27;:[&#x27;Firme&#x27;,&#x27;Alegre&#x27;,&#x27;Modesta&#x27;,&#x27;Miedosa&#x27;],&#x27;Habilidad&#x27;:[&#x27;Intimidación&#x27;,&#x27;Absorbe Fuego&#x27;,&#x27;Justiciero&#x27;],&#x27;Sexo&#x27;:[&#x27;Automático&#x27;,&#x27;Macho&#x27;,&#x27;Hembra&#x27;],&#x27;Objeto&#x27;:[&#x27;Sin objeto&#x27;,&#x27;Restos&#x27;,&#x27;Baya Zidra&#x27;],&#x27;Poké Ball&#x27;:[&#x27;Automática&#x27;,&#x27;Poké Ball&#x27;,&#x27;Ultra Ball&#x27;],&#x27;Variocolor&#x27;:[&#x27;No&#x27;,&#x27;Sí&#x27;],&#x27;Encuentro&#x27;:[&#x27;Cualquier encuentro legal&#x27;]};

function body(){
const editing=mode===&#x27;Equipo&#x27;||(mode===&#x27;Modificador&#x27;&amp;&amp;received&amp;&amp;!returned);
q(&#x27;.trainerbar&#x27;).hidden=mode!==&#x27;Equipo&#x27;;q(&#x27;#tp-slots&#x27;).hidden=mode!==&#x27;Equipo&#x27;;q(&#x27;.editorhead&#x27;).hidden=!editing;
if(mode===&#x27;Equipo&#x27;){if(q(&#x27;.modifierbar&#x27;))q(&#x27;.modifierbar&#x27;).hidden=true;teamBody();icons();return}

let toolbar=q(&#x27;.modifierbar&#x27;);if(!toolbar){toolbar=document.createElement(&#x27;div&#x27;);toolbar.className=&#x27;modifierbar&#x27;;q(&#x27;.panel&#x27;).insertBefore(toolbar,q(&#x27;.editor&#x27;))}
toolbar.hidden=false;toolbar.innerHTML=&#x27;&lt;div&gt;&lt;strong&gt;Pokémon recibido&lt;/strong&gt;&lt;div class=&quot;subtle&quot;&gt;Alex · ID 123456 · Original intacto conservado&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;green&quot; data-run=&quot;sendedited&quot; &#x27;+(status!==&#x27;legal&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27;&gt;Devolver editado&lt;/button&gt;&#x27;+iconButton(&#x27;undo-2&#x27;,&#x27;Devolver original intacto&#x27;,&#x27;original&#x27;)+iconButton(&#x27;scroll-text&#x27;,&#x27;Ver logs&#x27;,&#x27;logs&#x27;)+iconButton(&#x27;square&#x27;,&#x27;Cancelar intercambio&#x27;,&#x27;cancel&#x27;)+&#x27;&lt;/div&gt;&#x27;;
q(&#x27;#tp-status&#x27;).innerHTML=&#x27;&lt;strong style=&quot;color:&#x27;+(status===&#x27;legal&#x27;?&#x27;#22764f&#x27;:&#x27;#a52d39&#x27;)+&#x27;&quot;&gt;&#x27;+(status===&#x27;legal&#x27;?&#x27;✓ Copia legal · Lista para devolver&#x27;:&#x27;! Copia no validada · Puedes devolver el original intacto&#x27;)+&#x27;&lt;/strong&gt;&#x27;;
q(&#x27;footer&#x27;).textContent=&#x27;Edición del recibido · Entrenador e identidad originales conservados&#x27;;icons();return}
if(q(&#x27;.modifierbar&#x27;))q(&#x27;.modifierbar&#x27;).hidden=true;

const desc={
&#x27;Evolución&#x27;:&#x27;Dos intercambios: recibimos tu Pokémon y te lo devolvemos para que evolucione en tu consola, si cumple los requisitos.&#x27;,
&#x27;Nivel&#x27;:&#x27;Cambiamos únicamente el nivel del Pokémon recibido y validamos antes de devolverlo.&#x27;,
&#x27;Naturaleza&#x27;:&#x27;Cambiamos la naturaleza elegida; conservamos al entrenador y la identidad del Pokémon recibido.&#x27;,
&#x27;EVs&#x27;:&#x27;Aplicamos estos EV al Pokémon recibido y validamos el resultado antes de devolverlo.&#x27;,
&#x27;Modificador&#x27;:&#x27;Ofrecemos un Pokémon aleatorio legal. El que recibamos se abrirá en el editor, conservando sus datos originales.&#x27;,
&#x27;Validador&#x27;:&#x27;Analizamos el Pokémon recibido y mostramos el informe completo. La devolución conserva el original sin modificar.&#x27;};
let control=&#x27;&#x27;;if(mode===&#x27;Nivel&#x27;)control=&#x27;&lt;label class=&quot;servicefield&quot;&gt;Nivel de destino&lt;input type=&quot;number&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;100&quot; aria-label=&quot;Nivel de destino&quot;&gt;&lt;/label&gt;&#x27;;

if(mode===&#x27;EVs&#x27;)control=&#x27;&lt;div class=&quot;stats&quot;&gt;&lt;b&gt;EV&lt;/b&gt;&#x27;+[&#x27;PS&#x27;,&#x27;Ataque&#x27;,&#x27;Defensa&#x27;,&#x27;At. Esp.&#x27;,&#x27;Def. Esp.&#x27;,&#x27;Velocidad&#x27;].map(x=&gt;&#x27;&lt;label&gt;&#x27;+x+&#x27;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;252&quot; value=&quot;0&quot; aria-label=&quot;EV &#x27;+x+&#x27;&quot;&gt;&lt;/label&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;span class=&quot;subtle&quot;&gt;0–252 por atributo · 510 en total&lt;/span&gt;&#x27;;
const report=mode===&#x27;Validador&#x27;&amp;&amp;received?&#x27;&lt;div class=&quot;report&quot;&gt;Informe simulado\n✓ Datos de origen coherentes\n! Movimiento incompatible con el encuentro\n! Distribución de EV fuera de límites&lt;/div&gt;&#x27;:&#x27;&#x27;;
q(&#x27;#tp-content&#x27;).innerHTML=&#x27;&lt;div class=&quot;service&quot;&gt;&lt;h3&gt;&#x27;+mode+&#x27;&lt;/h3&gt;&lt;p style=&quot;margin:0&quot;&gt;&#x27;+desc[mode]+&#x27;&lt;/p&gt;&#x27;+(!received?control:&#x27;&#x27;)+report+(received?&#x27;&lt;span class=&quot;subtle&quot;&gt;Original recibido: Arcanine · Entrenador: Alex · Identidad conservada&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;div class=&quot;row&quot;&gt;&#x27;+(returned?&#x27;&lt;strong&gt;✓ Original devuelto · Informe conservado&lt;/strong&gt;&#x27;:received?&#x27;&lt;button class=&quot;green&quot; &#x27;+(mode!==&#x27;Validador&#x27;&amp;&amp;status!==&#x27;legal&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27; data-service=&quot;return&quot;&gt;Devolver &#x27;+(mode===&#x27;Validador&#x27;?&#x27;original intacto&#x27;:&#x27;Pokémon&#x27;)+&#x27;&lt;/button&gt;&#x27;:&#x27;&lt;button class=&quot;green iconbutton&quot; aria-label=&quot;Iniciar recepción&quot; data-tooltip=&quot;Iniciar recepción&quot; data-service=&quot;receive&quot;&gt;&lt;i data-lucide=&quot;arrow-left-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;span class=&quot;subtle&quot;&gt;Recibir → &#x27;+(mode===&#x27;Modificador&#x27;?&#x27;Editar&#x27;:&#x27;Procesar&#x27;)+&#x27; → Devolver&lt;/span&gt;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
q(&#x27;#tp-status&#x27;).textContent=received?(mode===&#x27;Validador&#x27;?&#x27;Excepción autorizada: devolver el original intacto, aunque sea ilegal.&#x27;:&#x27;Original preservado · Devolución a la misma sesión&#x27;):&#x27;Se ofrecerá un Pokémon de cortesía validado.&#x27;;icons();}
function state(){slots();const messages={legal:&#x27;✓ Equipo legal · Borrador guardado&#x27;,invalid:&#x27;! Caja 2 · El movimiento no es compatible con este encuentro.&#x27;,checking:&#x27;◌ Validando cambios… · Intercambio bloqueado&#x27;,error:&#x27;! No se pudo validar · Intercambio bloqueado&#x27;};q(&#x27;#tp-status&#x27;).innerHTML=`&lt;strong style=&quot;color:${status===&#x27;legal&#x27;?&#x27;#22764f&#x27;:&#x27;#a52d39&#x27;}&quot;&gt;${messages[status]}&lt;/strong&gt;`;}
function close(){q(&#x27;#tp-overlay&#x27;).hidden=true;previousFocus?.focus();}
