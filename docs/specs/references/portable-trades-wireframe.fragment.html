e-columns:repeat(3,1fr);gap:8px 12px}#trade-proposal .veil{position:absolute;inset:0;background:#15252b99;display:flex;align-items:center;justify-content:center;padding:18px;z-index:2}#trade-proposal .modal{background:var(--paper);border:4px solid var(--red);border-radius:16px;padding:20px;width:600px;max-width:100%;max-height:100%;overflow:auto}#trade-proposal h2{font-size:22px;margin:0 0 12px}#trade-proposal h3{font-size:17px;margin:0 0 10px}#trade-proposal p{font-size:15px;line-height:1.4;margin:8px 0 14px}#trade-proposal .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}#trade-proposal .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;background:#e0e7df;border-radius:10px}#trade-proposal .summary span{font-size:12px;display:block;color:#55635d;margin-bottom:4px}#trade-proposal .steps{padding:12px;background:#e0e7df;border-radius:10px;font-size:15px;line-height:1.8}#trade-proposal [hidden]{display:none!important}@media(max-width:650px){#trade-proposal .device{height:auto;min-height:480px}#trade-proposal .row{flex-wrap:wrap}#trade-proposal .slots{grid-template-columns:repeat(3,1fr)}#trade-proposal .formgrid{grid-template-columns:70px 1fr}#trade-proposal .moves{grid-column:1/-1}#trade-proposal .portrait{grid-row:span 3}#trade-proposal .trainer{margin-left:0}#trade-proposal .advanced{grid-template-columns:1fr 1fr}#trade-proposal .stats{gap:2px;font-size:11px}#trade-proposal .panel{min-height:390px}#trade-proposal .veil{align-items:flex-start}}
#trade-proposal .trainerbar{align-items:flex-end;gap:10px;padding:0}#trade-proposal .iconbutton{width:40px;height:34px;min-width:40px;padding:6px;display:inline-flex;align-items:center;justify-content:center}#trade-proposal .iconbutton svg{width:20px;height:20px}#trade-proposal .trainerbar .spacer{flex:1}#trade-proposal .slot{height:56px}#trade-proposal .slot img{width:38px;height:34px;object-fit:contain;display:block;margin:auto;image-rendering:pixelated}#trade-proposal .portrait img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated}#trade-proposal .searchwrap{position:relative}#trade-proposal .searchwrap input{padding-left:29px}#trade-proposal .searchwrap>svg{position:absolute;left:8px;top:9px;width:16px;height:16px;color:#5c6870;pointer-events:none}#trade-proposal #tp-start{align-self:center;height:48px;width:48px}#trade-proposal .status{min-height:24px}#trade-proposal .panel{gap:8px;padding-top:8px;padding-bottom:8px}#trade-proposal .row .rolebutton{font-size:14px}#trade-proposal .localhint{margin-left:auto;font-size:12px;color:#5c6870}#trade-proposal .slots{gap:10px}#trade-proposal .iconbutton:disabled{opacity:.65}#trade-proposal .summary>div{min-height:44px}#trade-proposal .summary span{min-height:16px}
#trade-proposal .modepick{width:150px;margin-right:auto}#trade-proposal .formgrid{grid-template-columns:80px 1.35fr 1fr .5fr .65fr;gap:7px 9px}#trade-proposal .moves{grid-column:span 4}#trade-proposal .switch{appearance:none;width:48px;height:28px;min-height:28px;border-radius:18px;background:#b5bdbb;position:relative;padding:0;margin-top:3px}#trade-proposal .switch:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:white;left:2px;top:2px}#trade-proposal .switch:checked{background:#22764f}#trade-proposal .switch:checked:before{left:22px}#trade-proposal .service{display:flex;flex-direction:column;gap:18px;padding:12px 4px}#trade-proposal .servicefield{max-width:320px}#trade-proposal .service .steps{line-height:1.5}#trade-proposal .originhint{font-size:13px;color:#53655c;margin:0 0 6px}#trade-proposal .report{white-space:pre-line;font-size:14px;background:#e4e8df;padding:12px;border-radius:8px}@media(max-width:650px){#trade-proposal .formgrid{grid-template-columns:1fr 1fr}#trade-proposal .moves{grid-column:1/-1}#trade-proposal .portrait{display:none}}
#trade-proposal .runview{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:6px 0}#trade-proposal .runqueue{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}#trade-proposal .runpokemon{border-radius:10px;background:#e2e7e1;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}#trade-proposal .runpokemon.current{outline:2px solid #00a2af}#trade-proposal .runpokemon img{width:52px;height:45px;object-fit:contain;image-rendering:pixelated}#trade-proposal .runpokemon small{font-size:11px;color:#42624d}#trade-proposal .empty{height:45px;padding:16px}#trade-proposal .spinner{display:inline-block;width:17px;height:17px;border:2px solid #a5b8b2;border-top-color:#168775;border-radius:50%;vertical-align:middle;animation:tp-spin 1s linear infinite}#trade-proposal .runheading h2{margin:0 0 6px;font-size:22px}#trade-proposal .runheading p{margin:0;font-size:14px}#trade-proposal .receivedcard{display:flex;align-items:center;gap:16px;padding:8px;background:#e4e9df;border-radius:12px}#trade-proposal .receivedcard img{width:88px;height:88px;object-fit:contain;image-rendering:pixelated}#trade-proposal .receivedcard p{margin:6px 0;font-size:14px}#trade-proposal .runreport{font-size:13px;line-height:1.4;overflow:auto;max-height:115px}#trade-proposal .logconsole{background:#243139;color:#eaf2ec;padding:16px;border-radius:10px;white-space:pre-wrap;max-height:245px;overflow:auto;font-size:13px}@keyframes tp-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#trade-proposal .spinner{animation:none}}@media(max-width:650px){#trade-proposal .runqueue{grid-template-columns:repeat(3,1fr)}}
#trade-proposal .modifierbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px;border-bottom:1px solid #c8cdca;flex-shrink:0}#trade-proposal .modifierbar strong{font-size:18px}#trade-proposal .modifierbar .subtle{margin-top:6px}#trade-proposal .modifierbar .iconbutton{height:38px}#trade-proposal .modifierbar button.green{height:38px}#trade-proposal .modifierbar:not([hidden])~.editor{padding-top:4px;border-top:0}#trade-proposal .modifierbar:not([hidden])~.editor .formgrid{gap:14px 10px}#trade-proposal .modifierbar:not([hidden])~.editor .portrait img{width:80px;height:90px}@media(max-width:650px){#trade-proposal .modifierbar{flex-wrap:wrap}}
#trade-proposal .receivedcard.valid{background:#d9efdf}#trade-proposal .receivedcard.invalid{background:#f5dcdd}#trade-proposal .receivedcard.pending{background:#e4e7e5}#trade-proposal .validatorinfo{flex:1;min-width:0}#trade-proposal .resultbadge{font-size:15px;white-space:nowrap}#trade-proposal .valid .resultbadge{color:#176538}#trade-proposal .invalid .resultbadge{color:#9d2534}#trade-proposal .validationlist{max-height:220px;overflow:auto;padding-left:24px;font-size:16px;line-height:1.7}
</style>
<div id="trade-proposal">
<div class="demo"><strong>Wireframe · 800 × 480 · datos simulados</strong><label>Estado de ejemplo<select id="tp-state"><option value="legal">Todos legales</option><option value="invalid">Una caja no legal</option><option value="checking">Validando cambios</option><option value="error">No se pudo validar</option></select></label></div>
<div class="device">
<header><span class="lens"></span><button aria-label="Volver a juegos" data-modal="back">‹</button><strong>POKÉDEX · ESCARLATA / PÚRPURA</strong><button aria-label="Ajustes de conexión" data-modal="connection">⚙</button></header>
<main class="panel">
<div class="row tabs spread"><button class="active" aria-selected="true">Intercambios</button><select id="tp-mode" class="modepick" aria-label="Tipo de intercambio"><option>Equipo</option><option>Evolución</option><option>Nivel</option><option>Naturaleza</option><option>EVs</option><option>Modificador</option><option>Validador</option></select><button data-modal="connection">Anfitrión · 1234 5678 ▾</button></div>
<div class="row trainerbar"><label class="trainer">Entrenador<input id="tp-trainer" type="search" list="tp-trainers" value="Base de pokeLDN" placeholder="Buscar entrenador…"><datalist id="tp-trainers"><option value="Base de pokeLDN"></option><option value="Alex · Púrpura"></option></datalist></label><button class="iconbutton" data-modal="trainer" aria-label="Datos del entrenador" data-tooltip="Datos del entrenador"><i data-lucide="contact-round" aria-hidden="true"></i></button><button class="green iconbutton" data-modal="sync" aria-label="Encontrar mi entrenador" data-tooltip="Encontrar mi entrenador"><i data-lucide="user-round-search" aria-hidden="true"></i></button><span class="spacer"></span><span class="localhint">Conexión local</span><button class="danger iconbutton" data-modal="clearall" aria-label="Vaciar equipo" data-tooltip="Vaciar equipo"><i data-lucide="trash-2" aria-hidden="true"></i></button></div>
<div class="slots" id="tp-slots"></div>
<section class="editor"><div class="row editorhead spread"><div class="row" role="tablist" aria-label="Editor Pokémon"><button class="active" data-editor="basic" role="tab" aria-selected="true">Básico</button><button data-editor="stats" role="tab" aria-selected="false">EV / IV</button><button data-editor="advanced" role="tab" aria-selected="false">Avanzado</button></div><button class="danger iconbutton" data-modal="clearone" aria-label="Vaciar esta caja" data-tooltip="Vaciar esta caja"><i data-lucide="eraser" aria-hidden="true"></i></button></div>
<div id="tp-content"></div><div id="tp-status" class="status" aria-live="polite"></div></section>
</main><footer>← → Navegar · Enter Elegir · Esc Volver · Guardado automático</footer>
<div class="veil" id="tp-overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-label="Detalles" id="tp-dialog"></section></div>
</div></div>
<script>
(()=>{const root=document.getElementById('trade-proposal');const q=s=>root.querySelector(s);let box=0,editor='basic',status='legal',invalidBox=1,mode='Equipo',received=false,returned=false;let team=['Arcanine','Pikachu','','','',''];let previousFocus;let fieldId=0;
const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})};
const sprite=name=>`<img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${name==='Pikachu'?25:59}.png" alt="${name}">`;
const choices={'Especie':['Arcanine','Pikachu','Eevee','Charizard'],'Naturaleza':['Firme','Alegre','Modesta','Miedosa'],'Habilidad':['Intimidación','Absorbe Fuego','Justiciero'],'Sexo':['Automático','Macho','Hembra'],'Objeto':['Sin objeto','Restos','Baya Zidra'],'Poké Ball':['Automática','Poké Ball','Ultra Ball'],'Variocolor':['No','Sí'],'Encuentro':['Cualquier encuentro legal']};
const field=(name,value,options=false)=>{const id='tp-list-'+fieldId++;const values=choices[name]||['Automático','Lanzallamas','Mordisco','Velocidad Extrema','Protección','Rayo'];return `<label>${name}${options?`<div class="searchwrap"><i data-lucide="search" aria-hidden="true"></i><input type="search" list="${id}" value="${value}" aria-label="${name}" placeholder="Buscar…" data-check="${name}"><datalist id="${id}">${values.map(v=>`<option value="${v}"></option>`).join('')}</datalist></div>`:`<input value="${value}" aria-label="${name}" data-check="${name}">`}</label>`};
function slots(){q('#tp-slots').innerHTML=team.map((name,i)=>`<button class="slot ${i===box?'active':''}" data-box="${i}" aria-pressed="${i===box}">${name?sprite(name):'<b>＋</b>'}${name||`Caja ${i+1}`} ${name?`<span class="${status==='invalid'&&i===invalidBox?'bad':'ok'}">${status==='checking'?'…':status==='error'?'?':status==='invalid'&&i===invalidBox?'!':'✓'}</span>`:''}</button>`).join('')+`<button id="tp-start" class="green iconbutton" aria-label="Iniciar intercambio" data-tooltip="Iniciar intercambio" ${status!=='legal'||!team.some(Boolean)?'disabled':''} data-modal="trade"><i data-lucide="arrow-left-right" aria-hidden="true"></i></button>`;icons();}
function teamBody(){root.querySelectorAll('[data-editor]').forEach(b=>{b.classList.toggle('active',b.dataset.editor===editor);b.setAttribute('aria-selected',b.dataset.editor===editor)});if(!team[box]){q('#tp-content').innerHTML=`<div class="row" style="padding:24px 0"><strong>Caja ${box+1} vacía</strong><button class="green" data-add>＋ Crear Pokémon</button></div>`;return}if(editor==='basic')q('#tp-content').innerHTML=`<div class="formgrid"><div class="portrait">${sprite(team[box])}<small>Caja ${box+1}</small></div>${field('Especie',team[box],true)}${field('Apodo','')}${field('Nivel','100')}<label>Variocolor<input class="switch" type="checkbox" role="switch" aria-label="Variocolor"></label><div class="moves">${field('Movimiento 1','Lanzallamas',true)}${field('Movimiento 2','Mordisco',true)}${field('Movimiento 3','Velocidad Extrema',true)}${field('Movimiento 4','Automático',true)}</div></div>`;else if(editor==='stats')q('#tp-content').innerHTML=`<div class="stats"><span></span>${['PS','Ataque','Defensa','At. Esp.','Def. Esp.','Velocidad'].map(x=>`<span>${x}</span>`).join('')}<b>EV</b>${[0,252,0,0,6,252].map((v,i)=>`<input aria-label="EV ${i+1}" value="${v}">`).join('')}<b>IV</b>${[31,31,31,31,31,31].map((v,i)=>`<input aria-label="IV ${i+1}" value="${v}">`).join('')}</div><div class="row spread" style="margin-top:12px"><span class="subtle">EV: 510 / 510 · IV: 0–31 por atributo</span><button data-modal="ev">Maximizar EV</button><button data-modal="friendship">Amistad al máximo</button></div>`;else q('#tp-content').innerHTML=`<div class="advanced">${field('Naturaleza','Firme',true)}${field('Habilidad','Intimidación',true)}${field('Sexo','Automático',true)}${field('Objeto','Sin objeto',true)}${field('Poké Ball','Automática',true)}${field('Amistad','255')}</div><div class="row" style="margin-top:8px"><button data-modal="origin">Origen y encuentro…</button><button data-modal="extra">Apodo y más…</button><button data-modal="friendship">Amistad al máximo</button></div>`;}
function body(){
const editing=mode==='Equipo'||(mode==='Modificador'&&received&&!returned);
q('.trainerbar').hidden=mode!=='Equipo';q('#tp-slots').hidden=mode!=='Equipo';q('.editorhead').hidden=!editing;
if(mode==='Equipo'){if(q('.modifierbar'))q('.modifierbar').hidden=true;teamBody();icons();return}
if(editing){teamBody();q('.editorhead [data-modal="clearone"]').hidden=true;
let toolbar=q('.modifierbar');if(!toolbar){toolbar=document.createElement('div');toolbar.className='modifierbar';q('.panel').insertBefore(toolbar,q('.editor'))}
toolbar.hidden=false;toolbar.innerHTML='<div><strong>Pokémon recibido</strong><div class="subtle">Alex · ID 123456 · Original intacto conservado</div></div><div class="row"><button class="green" data-run="sendedited" '+(status!=='legal'?'disabled':'')+'>Devolver editado</button>'+iconButton('undo-2','Devolver original intacto','original')+iconButton('scroll-text','Ver logs','logs')+iconButton('square','Cancelar intercambio','cancel')+'</div>';
q('#tp-status').innerHTML='<strong style="color:'+(status==='legal'?'#22764f':'#a52d39')+'">'+(status==='legal'?'✓ Copia legal · Lista para devolver':'! Copia no validada · Puedes devolver el original intacto')+'</strong>';
q('footer').textContent='Edición del recibido · Entrenador e identidad originales conservados';icons();return}
if(q('.modifierbar'))q('.modifierbar').hidden=true;

const desc={
'Evolución':'Dos intercambios: recibimos tu Pokémon y te lo devolvemos para que evolucione en tu consola, si cumple los requisitos.',
'Nivel':'Cambiamos únicamente el nivel del Pokémon recibido y validamos antes de devolverlo.',
'Naturaleza':'Cambiamos la naturaleza elegida; conservamos al entrenador y la identidad del Pokémon recibido.',
'EVs':'Aplicamos estos EV al Pokémon recibido y validamos el resultado antes de devolverlo.',
'Modificador':'Ofrecemos un Pokémon aleatorio legal. El que recibamos se abrirá en el editor, conservando sus datos originales.',
'Validador':'Analizamos el Pokémon recibido y mostramos el informe completo. La devolución conserva el original sin modificar.'};
let control='';if(mode==='Nivel')control='<label class="servicefield">Nivel de destino<input type="number" min="1" max="100" value="100" aria-label="Nivel de destino"></label>';
if(mode==='Naturaleza')control='<div class="servicefield">'+field('Naturaleza','Firme',true)+'</div>';
if(mode==='EVs')control='<div class="stats"><b>EV</b>'+['PS','Ataque','Defensa','At. Esp.','Def. Esp.','Velocidad'].map(x=>'<label>'+x+'<input type="number" min="0" max="252" value="0" aria-label="EV '+x+'"></label>').join('')+'</div><span class="subtle">0–252 por atributo · 510 en total</span>';
const report=mode==='Validador'&&received?'<div class="report">Informe simulado\n✓ Datos de origen coherentes\n! Movimiento incompatible con el encuentro\n! Distribución de EV fuera de límites</div>':'';
q('#tp-content').innerHTML='<div class="service"><h3>'+mode+'</h3><p style="margin:0">'+desc[mode]+'</p>'+(!received?control:'')+report+(received?'<span class="subtle">Original recibido: Arcanine · Entrenador: Alex · Identidad conservada</span>':'')+'<div class="row">'+(returned?'<strong>✓ Original devuelto · Informe conservado</strong>':received?'<button class="green" '+(mode!=='Validador'&&status!=='legal'?'disabled':'')+' data-service="return">Devolver '+(mode==='Validador'?'original intacto':'Pokémon')+'</button>':'<button class="green iconbutton" aria-label="Iniciar recepción" data-tooltip="Iniciar recepción" data-service="receive"><i data-lucide="arrow-left-right" aria-hidden="true"></i></button><span class="subtle">Recibir → '+(mode==='Modificador'?'Editar':'Procesar')+' → Devolver</span>')+'</div></div>';
q('#tp-status').textContent=received?(mode==='Validador'?'Excepción autorizada: devolver el original intacto, aunque sea ilegal.':'Original preservado · Devolución a la misma sesión'):'Se ofrecerá un Pokémon de cortesía validado.';icons();}
function state(){slots();const messages={legal:'✓ Equipo legal · Borrador guardado',invalid:'! Caja 2 · El movimiento no es compatible con este encuentro.',checking:'◌ Validando cambios… · Intercambio bloqueado',error:'! No se pudo validar · Intercambio bloqueado'};q('#tp-status').innerHTML=`<strong style="color:${status==='legal'?'#22764f':'#a52d39'}">${messages[status]}</strong>`;}
function close(){q('#tp-overlay').hidden=true;previousFocus?.focus();}
function modal(title,html,actions='<button data-close>Volver</button>'){previousFocus=document.activeElement;q('#tp-dialog').innerHTML=`<h2>${title}</h2>${html}<div class="actions">${actions}</div>`;q('#tp-overlay').hidden=false;q('#tp-dialog').querySelector('button,input,select')?.focus();}
function open(kind){if(kind==='sync')modal('Encontrar mi entrenador',`<p>Recibiremos un Pokémon capturado por ti en este juego para identificar a su entrenador original.</p><div class="steps">1. Preparar y validar un Pokémon de regalo.<br>2. Iniciar un intercambio local con tu consola.<br>3. Recibir tu Pokémon e identificar al entrenador.<br>4. Guardar el perfil y seleccionarlo.</div><p class="subtle">No uses un Pokémon recibido de otra persona. Tu equipo de seis cajas no se modifica.</p>`,`<button data-close>Cancelar</button><button class="green" data-flow="waiting">Iniciar búsqueda</button>`);
else if(kind==='trainer')modal('Datos del entrenador',`<h3>${q('#tp-trainer').value}</h3><div class="summary"><div><span>Nombre</span>Alex</div><div><span>Sexo</span>Masculino</div><div><span>Idioma</span>Español</div><div><span>ID visible</span>123456</div><div><span>ID secreto visible</span>0123</div><div><span>Juego</span>Púrpura</div></div><p class="subtle">Datos ilustrativos. El entrenador base se conserva; cada juego tendrá su propia lista.</p>`);
else if(kind==='connection')modal('Conexión de intercambio',`<div class="advanced"><label>Papel<select aria-label="Papel"><option>Anfitrión</option><option>Unirse</option></select></label>${field('Código','1234 5678')}</div><p class="subtle">Conexión local. «Unirse» solo estará disponible en los juegos compatibles.</p><p class="subtle">La versión se pedirá cuando la acción lo requiera (Rojo Fuego / Verde Hoja).</p>`,`<button data-close>Listo</button>`);
else if(kind==='clearall'||kind==='clearone')modal(kind==='clearall'?'¿Vaciar las seis cajas?':`¿Vaciar la caja ${box+1}?`,`<p>Se borrará ${kind==='clearall'?'el equipo preparado':'este Pokémon y su configuración'}. Los entrenadores guardados se conservan.</p>`,`<button data-close>Cancelar</button><button class="danger" data-clear="${kind}">Vaciar</button>`);
else if(kind==='report')modal('Resultado de validación',`<p>${status==='invalid'?'Caja 2 · Pikachu: combinación de movimiento y encuentro no válida.':status==='checking'?'La última edición todavía no tiene un resultado de validación.':'El servicio de validación no respondió.'}</p><p>Todos los campos permanecen editables. Solo se habilitará el intercambio cuando las cajas ocupadas tengan un resultado legal actualizado.</p>`);
else if(kind==='origin')modal('Origen y encuentro',`${field('Encuentro','Cualquier encuentro legal',true)}<p class="subtle">Opciones y restricciones específicas del juego, con el selector existente de pokeLDN.</p>`);
else if(kind==='extra')modal('Apodo y opciones del juego',`${field('Apodo','')}<p>Las opciones específicas, como Alfa, aparecerán solo en juegos compatibles.</p>`);
else if(kind==='ev')modal('Maximizar EV',`<p>Se conservará el atajo de pokeLDN con sus límites por atributo y total. No habrá atajo para maximizar IV.</p><p class="subtle">Esta propuesta solo muestra el flujo; no aplica cambios reales.</p>`);
else if(kind==='friendship')modal('Amistad al máximo',`<p>El atajo fijará la amistad al máximo permitido y volverá a validar el Pokémon.</p>`);
else if(kind==='trade')modal('Intercambio listo',`<p>${team.filter(Boolean).length} Pokémon preparados · Anfitrión · Local</p><p>En la app, este botón iniciará la sesión con la cola validada. Aquí solo se muestra la propuesta visual.</p>`);
else modal('Volver a los juegos','<p>El borrador del equipo se conservará por juego.</p>');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))close();else if(b.dataset.modal)open(b.dataset.modal);else if(b.dataset.editor){editor=b.dataset.editor;body()}else if(b.dataset.box!==undefined){box=Number(b.dataset.box);slots();body()}else if(b.hasAttribute('data-add')){team[box]='Arcanine';state();body()}else if(b.dataset.clear){if(b.dataset.clear==='clearall')team=team.map(()=>'');else team[box]='';close();state();body()}else if(b.dataset.flow==='waiting')modal('Buscando tu entrenador…',`<div class="steps">✓ Pokémon de regalo preparado y validado<br>◌ Esperando tu intercambio</div><p>En tu consola, usa el código 1234 5678 y ofrece un Pokémon capturado por ti.</p><p class="subtle">Simulación: elige un resultado para revisar el diseño.</p>`,`<button data-close>Cancelar búsqueda</button><button data-flow="failed">No identificable</button><button class="green" data-flow="found">Intercambio completado</button>`);else if(b.dataset.flow==='failed')modal('No pudimos identificar tu entrenador','<p>El Pokémon recibido no permite confirmar un entrenador compatible con este juego. No se guardó ningún perfil.</p>','<button data-close>Volver</button><button data-modal="sync">Reintentar</button>');else if(b.dataset.flow==='found'){q('#tp-trainer').value='Alex · Púrpura';modal('Entrenador guardado y seleccionado',`<div class="summary"><div><span>Nombre</span>Alex</div><div><span>Sexo</span>Masculino</div><div><span>Idioma</span>Español</div><div><span>ID visible</span>123456</div><div><span>ID secreto visible</span>0123</div><div><span>Juego</span>Púrpura</div></div><p>Disponible en tu lista de entrenadores de este juego. El entrenador base permanece intacto.</p><p class="subtle">El equipo se volverá a generar y validar con el nuevo entrenador.</p>`,'<button class="green" data-close>Volver al equipo</button>')}});
q('#tp-state').addEventListener('change',e=>{status=e.target.value;invalidBox=1;state();if(mode!=='Equipo')body()});q('#tp-mode').addEventListener('change',e=>{mode=e.target.value;received=false;returned=false;state();body()});root.addEventListener('click',e=>{const b=e.target.closest('[data-service]');if(!b)return;if(b.dataset.service==='receive'){received=true;editor='basic'}else returned=true;body()});root.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!q('#tp-overlay').hidden){const list=[...q('#tp-dialog').querySelectorAll('button,input,select')];const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});state();body();icons();
root.addEventListener('click',()=>icons());
root.addEventListener('focusout',e=>{if(!e.target.matches('[data-check="Nivel"]'))return;const input=e.target;const invalid=input.dataset.check==='Nivel'&&(!Number.isInteger(Number(input.value))||Number(input.value)<1||Number(input.value)>100);status=invalid?'invalid':'legal';invalidBox=box;state();if(q('.modifierbar [data-run="sendedited"]'))q('.modifierbar [data-run="sendedited"]').disabled=invalid;if(invalid)q('#tp-status').innerHTML='<strong style="color:#a52d39">! Nivel: introduce un entero entre 1 y 100.</strong>';});
let run=null;let locked=[];let savedHidden=[];
const progressBox=document.createElement('section');progressBox.className='runview';progressBox.hidden=true;q('.panel').append(progressBox);
const advance=document.createElement('button');advance.textContent='Avanzar simulación';advance.hidden=true;q('.demo').append(advance);
function lockUI(){locked=[...q('.device').querySelectorAll('button,input,select')].filter(el=>!el.closest('#tp-overlay')&&!el.closest('.runview')).map(el=>[el,el.disabled]);locked.forEach(([el])=>el.disabled=true)}
function unlockUI(){locked.forEach(([el,value])=>el.disabled=value);locked=[]}
function logRun(text){run.logs.push('[SIMULACIÓN] '+text);if(q('.logconsole'))q('.logconsole').textContent=run.logs.join('\n')}
function launchRun(){run={phase:'waiting',index:0,completed:0,original:false,logs:[],editing:false,returnOriginal:false};logRun('Sesión iniciada · '+mode+' · Anfitrión · Local');lockUI();run.index=Math.max(0,team.findIndex(Boolean));q('footer').textContent='Intercambio en curso · Configuración bloqueada';advance.hidden=false;paintRun()}
function iconButton(icon,label,action,disabled=false){return `<button class="iconbutton" aria-label="${label}" data-tooltip="${label}" data-run="${action}" ${disabled?'disabled':''}><i data-lucide="${icon}" aria-hidden="true"></i></button>`}
function paintRun(){
const teamMode=mode==='Equipo',finished=['done','stopped'].includes(run.phase),busy=!finished&&run.phase!=='review'&&run.phase!=='illegal';
if(!savedHidden.length){savedHidden=[...q('.panel').children].filter(el=>el!==progressBox).map(el=>[el,el.hidden]);savedHidden.forEach(([el])=>{if(!el.classList.contains('tabs'))el.hidden=true})}
progressBox.hidden=false;
const titles={reconnect:'Verificando consola de origen',waiting:'Esperando a tu consola',receiving:'Intercambio en curso',received:'Pokémon recibido',processing:mode==='Validador'?'Analizando legalidad':mode==='Evolución'?'Preparando devolución': 'Aplicando cambios y validando',returning:run.returnOriginal?'Devolviendo original intacto':'Devolución en curso',done:teamMode?'Equipo enviado':'Pokémon devuelto',cancel:'Cancelación solicitada',stopped:'Sesión detenida',review:'Listo para editar',illegal:'La copia modificada no es legal'};
let description={reconnect:'Reconecta la misma consola. No se devolverá el original a otro participante.',waiting:'Conecta tu consola con el código 1234 5678.',receiving:'Confirma el intercambio en tu consola. No desconectes la placa.',received:'Conservamos el original y sus datos de entrenador.',processing:mode==='Evolución'?'El original se ofrece de vuelta. La evolución ocurre en la consola si cumple los requisitos.':mode==='Validador'?'Analizamos el original sin modificar ningún dato.':'Solo una copia de trabajo recibe las modificaciones.',returning:'Completa el segundo intercambio con la misma consola.',done:'Finalización confirmada. Ya puedes cambiar la configuración.',cancel:'Esperando el cierre de pokeLDN. Cancelar no revierte un intercambio confirmado.',stopped:run.original?'Hay un Pokémon pendiente de devolución. El original se conserva para recuperar la sesión.':'No se confirmó ningún Pokémon recibido. Revisa el estado de tu consola.',review:'El transporte está en pausa. Solo se habilita el editor de este Pokémon.',illegal:'Se bloquea la copia editada. Puedes devolver el original intacto, aunque sea ilegal.'}[run.phase]||'';
let queue='';if(teamMode){queue='<div class="runqueue">'+team.map((name,i)=>{const mark=!name?'—':i<run.completed?'<span style="color:#207747">✓</span>':!finished&&i===run.index?'<span class="spinner" aria-label="En curso"></span>':'◷';return `<div class="runpokemon ${i===run.index&&!finished?'current':''}">${name?sprite(name):'<span class="empty">—</span>'}<span>${name||'Vacía'} ${mark}</span><small>${!name?'':i<run.completed?'Enviado':i===run.index&&!finished?'En curso':finished?'Sin enviar':'En cola'}</small></div>`}).join('')+'</div>'}
let details='';if(!teamMode&&run.original){details=`<div class="receivedcard">${sprite('Arcanine')}<div><strong>Arcanine · Nv. 50 · ♂</strong><p>Entrenador original: Alex · ID 123456 · Español</p><span class="subtle">Original intacto conservado · ${run.phase==='returning'?'Devolviendo':run.phase==='done'?'Devuelto':'Recibido'}</span></div></div>`}
if(mode==='Validador'&&run.original){
const result=run.validation;
const tone=result?(result.legal?'valid':'invalid'):'pending';
const badge=result?(result.legal?'✓ Legal':'! No legal'):'◌ Validando…';
details=`<div class="receivedcard ${tone}">${sprite('Arcanine')}<div class="validatorinfo"><div class="row spread"><strong>Arcanine · Nv. 50 · ♂</strong><strong class="resultbadge">${badge}</strong></div><p>Entrenador original: Alex · ID 123456 · Español</p><span class="subtle">${run.phase==='done'?'Original devuelto sin modificaciones':'Original intacto · Se devolverá incluso si no es legal'}</span></div>${result?iconButton('clipboard-list','Detalles de legalidad','validation'):''}</div>`;
}

let actions=finished?'<button data-run="finish">Volver</button>':busy?'<button class="iconbutton green" disabled aria-label="Intercambio en progreso"><span class="spinner"></span></button>':'';
if(!finished)actions+=iconButton('square','Cancelar intercambio','cancel',run.phase==='cancel');actions+=iconButton('scroll-text','Ver logs','logs');

if(run.phase==='illegal')actions+='<button class="green" data-run="original">Devolver original intacto</button>';
if(run.phase==='stopped'&&run.original)actions+='<button data-run="recover">Recuperar devolución</button>';
progressBox.innerHTML=`<div class="row spread"><strong>${mode}</strong><div class="row">${actions}</div></div>${queue}<div class="runheading" aria-live="polite"><h2>${titles[run.phase]}</h2><p>${description}</p></div>${details}`;
q('footer').textContent=finished?'Sesión finalizada · Informe disponible':'Intercambio en curso · Configuración bloqueada';advance.disabled=finished||run.phase==='review'||run.phase==='illegal';icons();}
function nextRun(){if(!run)return;if(mode==='Validador'&&run.phase==='processing'&&['checking','error'].includes(status)){logRun('Validación pendiente o sin resultado; no se declara legalidad');paintRun();return}if(run.phase==='cancel'){run.phase='stopped';logRun('Proceso detenido; comprobar estado de la consola');paintRun();return}
if(mode==='Equipo'){if(run.phase==='waiting')run.phase='receiving';else if(run.phase==='receiving'){run.completed++;const occupied=team.map((name,i)=>name?i:-1).filter(i=>i>=0);if(run.completed>=occupied.length)run.phase='done';else{run.index=occupied[run.completed];run.phase='waiting'}}}
else{const phases={reconnect:'returning',waiting:'receiving',receiving:'received',received:mode==='Modificador'?'review':'processing',processing:status==='invalid'&&mode!=='Validador'&&mode!=='Evolución'?'illegal':'returning',returning:'done'};run.phase=phases[run.phase]||run.phase;if(run.phase==='received')run.original=true;if(mode==='Validador'||mode==='Evolución')run.returnOriginal=true}
if(mode==='Validador'&&run.phase==='returning'&&!run.validation){run.validation={legal:status!=='invalid',messages:status==='invalid'?['Movimiento incompatible con el encuentro.','Distribución de EV fuera de límites.']:['No se encontraron fallos de legalidad.']};logRun('Validación terminada: '+(run.validation.legal?'Legal':'No legal'));run.validation.messages.forEach(logRun)}logRun('Estado: '+run.phase);if(mode==='Modificador'&&run.phase==='received'){openModifier();return}paintRun()}
advance.addEventListener('click',nextRun);
function openModifier(){
savedHidden.forEach(([el,value])=>el.hidden=value);savedHidden=[];progressBox.hidden=true;
received=true;editor='basic';run.phase='review';run.editing=true;body();
q('.device').querySelectorAll('button,input,select').forEach(el=>{if(!el.closest('#tp-overlay'))el.disabled=true});
q('#tp-content').querySelectorAll('input,select').forEach(el=>el.disabled=false);
q('.editorhead').querySelectorAll('[data-editor]').forEach(el=>el.disabled=false);
q('.modifierbar').querySelectorAll('button').forEach(el=>el.disabled=el.dataset.run==='sendedited'&&status!=='legal');
advance.disabled=true;icons();}
function finishRun(){savedHidden.forEach(([el,value])=>el.hidden=value);savedHidden=[];progressBox.hidden=true;advance.hidden=true;unlockUI();run=null;q('footer').textContent='← → Navegar · Enter Elegir · Esc Volver · Guardado automático';state();body();icons()}
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;
const isStart=button.dataset.modal==='trade'||button.dataset.service==='receive';if(isStart&&!run){e.stopImmediatePropagation();e.preventDefault();launchRun();return}
if(!button.dataset.run&&!(run&&button.dataset.service==='return'))return;e.stopImmediatePropagation();const action=button.dataset.run||'sendedited';
if(action==='validation'){modal('Informe de legalidad · simulado','<p><strong>'+(run.validation.legal?'✓ Legal':'! No legal')+'</strong> · Arcanine · Entrenador original: Alex</p><ul class="validationlist">'+run.validation.messages.map(message=>'<li>'+message+'</li>').join('')+'</ul><p class="subtle">El original permanece intacto. Este resultado no bloquea su devolución.</p>');return}
if(action==='logs'){modal('Logs del intercambio · simulados','<pre class="logconsole"></pre>');q('.logconsole').textContent=run.logs.join('\n');return}
if(action==='cancel'){modal('¿Cancelar el intercambio?', '<p>Se solicitará el cierre de la sesión. Un intercambio ya confirmado no se deshace.</p><p>Si ya recibimos tu Pokémon, su original se conserva y la devolución quedará pendiente.</p>','<button data-close>Continuar intercambio</button><button class="danger" data-run="confirmcancel">Solicitar cancelación</button>');return}
if(action==='confirmcancel'){close();run.phase='cancel';logRun('Solicitud de parada enviada; esperando cierre');paintRun();return}
if(action==='finish'){finishRun();return}
if(action==='recover'){run.phase='reconnect';run.returnOriginal=true;logRun('Recuperación: reconectar y verificar la misma consola antes de devolver');paintRun();return}
if(action==='original'){run.returnOriginal=true;run.phase='returning';logRun('Excepción: devolver exclusivamente el original intacto');paintRun();return}

if(action==='sendedited'){q('.device').querySelectorAll('button,input,select').forEach(el=>{if(!el.closest('#tp-overlay'))el.disabled=true});run.phase=status==='legal'?'returning':'illegal';logRun('Validación de la copia editada: '+status);paintRun();return}
},true);

})();
</script>
